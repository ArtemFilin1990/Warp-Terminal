[package]
name = "warp-terminal"
version = "0.1.0"
edition = "2021"
description = "A fast, modern terminal built for programming with agents"

[[bin]]
name = "warp"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["full"] }
